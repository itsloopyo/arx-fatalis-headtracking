;  Arx Fatalis Head Tracking
; 
;  Head tracking moves the view. The mouse still turns the character and
;  still decides where arrows, spells and sword swings go, so what you see
;  and what you aim at come apart. The cursor is redrawn on the point you
;  are actually aiming at, and picks up whatever is under it there.
; 
;  Centre your head in the tracker (OpenTrack's Center bind, or the CENTER
;  button in a phone app). This mod keeps no centre of its own.

[Network]
;  UDP port to listen on. 4242 is what OpenTrack sends to by default.
Port=4242

[General]
;  Whether tracking is live as soon as the game starts.
EnableOnStartup=1
;  Move the game's cursor onto the point you are aiming at. Turning this
;  off leaves the cursor where the game puts it, which is wherever your
;  head is pointed rather than where your character is.
MoveCrosshair=1
;  Vertical field of view in degrees. Arx has no setting of its own and
;  renders 75.95 degrees vertically, which widens horizontally on a wide
;  monitor. 0 leaves the game's own alone. 40 to 110 can be set, and the
;  view still narrows when you draw a bow either way.
FieldOfView=0
;  Write a line a second to ArxFatalisHeadTracking.log naming the camera the
;  shot leaves from, the camera the frame is drawn through and the point the
;  cursor is placed on. Only useful for reporting a problem.
Diagnostics=0

[Sensitivity]
;  Shape the pose in your tracker, not here, so one profile behaves the
;  same in every game. These stay at 1.0 unless you have a reason.
YawSensitivity=1
PitchSensitivity=1
RollSensitivity=1

[Inversion]
;  Fix a mirrored axis in your tracker where you can, so it is right in
;  every game at once.
InvertYaw=0
InvertPitch=0
InvertRoll=0

[Smoothing]
;  Which of these applies is decided per connection, by the address the
;  packets arrive from. Only loopback (127.0.0.1) counts as local: a
;  tracker running on this same PC but sending to the machine's LAN
;  address is treated as remote.
;  Both cover rotation and position. 0 is no smoothing at all.
LocalSmoothing=0
RemoteSmoothing=0.15

[Position]
;  Positional (6DOF) tracking - leaning. Limits are in metres.
PositionEnabled=1
;  As above: shape the pose in your tracker. X is side to side, Y is up
;  and down, Z is forward and back.
PositionSensitivityX=1
PositionSensitivityY=1
PositionSensitivityZ=1
;  How far the view may move from where the game put it, in metres.
PositionLimitX=0.3
PositionLimitY=0.2
;  Forward gets more room than backward so pulling back does not put the
;  view inside your own body.
PositionLimitZ=0.4
PositionLimitZBack=0.1

;  Stop a lean pushing the view through a wall. The trace uses the game's
;  own level collision. CollisionRadius is how far off a surface the eye is
;  held, in Arx units (1 unit = 1 cm), and must stay above the engine's
;  1-unit near clip or the wall is culled and you see through it anyway.
CollisionEnabled=1
CollisionRadius=18
CollisionReleaseSmoothing=0.9

[Hotkeys]
;  Virtual key codes. Every action also has a Ctrl+Shift chord for
;  keyboards with no navigation cluster.
;  End      / Ctrl+Shift+Y : tracking on or off
;  Page Up  / Ctrl+Shift+J : cycle 6DOF -> rotation only -> position only
; 
;  Both sets collide with something Arx already uses; pick whichever you
;  mind less. End, Page Up and Page Down are centre view, look up and look
;  down. Ctrl is magic mode and Shift is stealth mode, so holding a chord
;  enters both for as long as you hold it.
;  There is no recenter key. Centre your head in the tracker.
ToggleKey=0x23
CycleTrackingModeKey=0x21
