name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@a03c24290fae3a9c61f67adcb7c5ba4eedf69f20
    with:
      project-name: 'Arx Fatalis Head Tracking'
      version-source: cmake
      version-path: 'CMakeLists.txt'
      # The same set release.ps1 passes to New-ChangelogFromCommits. Differ, and the
      # GitHub release notes and the shipped CHANGELOG are generated from different
      # commits - a release whose only user-facing change touched CMakeLists.txt gets an
      # entry in one and not the other.
      artifact-paths: 'src/ CMakeLists.txt cameraunlock-core/ scripts/install.cmd scripts/uninstall.cmd'
      setup-msbuild: true
    permissions:
      contents: write
    secrets: inherit
