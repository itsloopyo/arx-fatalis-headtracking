name: Build

on:
# '**.md' is deliberately NOT ignored. The package step runs validate-notices, which
# validates THIRD-PARTY-NOTICES.md itself, so a markdown-only push is exactly the push that
# can break it - and skipping the build for those would leave the failure to surface
# mid-release instead of on the pull request.
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'

# Nothing here writes to the repository or to any package registry: it builds and
# inspects the ZIP it produced. Anything more is what the default token would hand
# to a compromised action.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace declares zero conda dependencies
      # (pixi is a task runner here), and the action's post-install `pixi list`
      # errors on an empty environment.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # The unit suites, through the same task a developer runs. Before the package
      # step, so a broken sanitizer or gameplay gate fails the build rather than being
      # packaged. Needs no game and writes only into build-tests/.
      - name: Run unit tests
        shell: pwsh
        run: |
          pixi run test
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pixi run test failed"
            exit 1
          }

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build-release ->
      # package); the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pixi run package failed"
            exit 1
          }

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
          Write-Host "  $($zip.Name) ($([math]::Round($zip.Length / 1KB, 2)) KB)"
